name: engine-verify

on:
  workflow_dispatch:
  pull_request:

jobs:
  darwin:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: cross build darwin/arm64
        run: CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags '-s -w' -o /tmp/pocketbox-darwin ./cmd/pocketbox
